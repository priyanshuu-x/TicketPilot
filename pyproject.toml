[project]
name = "ticketpilot"
version = "0.1.0"
description = "Multi-agent customer-support system with MCP, human-in-the-loop, memory and evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.24,<2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
